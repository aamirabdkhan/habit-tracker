<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waqt — Pehar (redesign)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0B09; --surface:#151310; --surface-2:#1D1A15;
  --rule:rgba(236,231,218,.09); --rule-2:rgba(236,231,218,.16);
  --ink:#ECE7DA; --ink-2:#9A9384; --ink-3:#5F5A4E;
  --gold:#C9943E; --gold-dim:rgba(201,148,62,.14);
  --green:#5FA46B; --green-dim:rgba(95,164,107,.14);
  --serif:"DM Serif Display",Georgia,serif;
  --sans:"Space Grotesk",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45;
  max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.wrap{padding:0 20px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3)}

.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:22px}
.brand .sun{width:20px;height:20px;color:var(--gold)}
.top .gear{background:none;border:none;color:var(--ink-2);cursor:pointer;padding:6px}
.top .gear svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}

.head{font-family:var(--serif);font-size:34px;padding:8px 0 0}
.daynav{display:flex;align-items:center;gap:12px;margin-top:6px}
.daynav .nb{background:none;border:1px solid var(--rule);border-radius:8px;color:var(--ink-2);width:34px;height:32px;cursor:pointer}
.daynav .dl{font-family:var(--mono);font-size:13px;color:var(--ink-2)}

/* calm free-time reveal — factual, not nagging */
.free{margin:18px 0 6px;border:1px solid var(--rule);border-radius:12px;padding:15px 16px;
  display:flex;align-items:baseline;gap:8px;background:linear-gradient(180deg,rgba(201,148,62,.04),transparent)}
.free .num{font-family:var(--serif);font-size:26px}
.free .lab{font-size:14px;color:var(--ink-2)}
.free .sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto}

/* timeline */
.tl{margin-top:20px}
.trow{display:flex;margin-bottom:8px}
.trow .tm{width:58px;flex:0 0 auto;font-family:var(--mono);font-size:12px;color:var(--ink-2);
  text-align:right;padding:15px 14px 0 0}
.trow .tm small{display:block;color:var(--ink-3);font-size:10px;margin-top:2px}
.blk{flex:1;min-width:0;border:1px solid var(--rule);border-left:3px solid var(--green);border-radius:10px;
  padding:13px 14px;display:flex;align-items:center;gap:12px}
.blk.task{border-left-color:var(--gold)}
.blk .nm{font-size:15px;flex:1}
.blk .dur{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.blk .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--rule-2);flex:0 0 auto;display:grid;place-items:center}
.blk .box svg{width:11px;height:11px;stroke:var(--bg);fill:none;stroke-width:3}
.blk.done .box{background:var(--green);border-color:var(--green)}
.blk.task.done .box{background:var(--gold);border-color:var(--gold)}
.blk.done .nm{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.blk .edit{color:var(--ink-3);cursor:pointer;display:flex}
.blk .edit svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
/* free stretch — quiet, invites planning without nagging */
.blk.free-blk{border:1px dashed var(--rule);border-left:1px dashed var(--rule);background:none;cursor:pointer}
.blk.free-blk .nm{font-family:var(--serif);font-style:italic;color:var(--ink-3);font-size:15px}
.blk.free-blk .plan{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em}
/* now marker */
.nowrow{display:flex;align-items:center;gap:10px;margin:4px 0 12px;padding-left:58px}
.nowrow .line{flex:1;height:1px;background:var(--gold);opacity:.5}
.nowrow .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

.tabs{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;
  background:rgba(12,11,9,.94);backdrop-filter:blur(12px);border-top:1px solid var(--rule);
  display:grid;grid-template-columns:repeat(4,1fr);padding:10px 0 16px;z-index:8}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;
  color:var(--ink-3);cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.06em}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.tab.on{color:var(--gold)}
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <circle cx="12" cy="10" r="4"/><path d="M12 2v2M4 10H2M22 10h-2M6 4.5 5 3.5M18 4.5l1-1"/>
      <path d="M8 20l4-3 4 3" stroke-linejoin="round"/></svg>
    Waqt
  </div>
  <button class="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg></button>
</div>

<div class="wrap">
  <div class="head">Pehar</div>
  <div class="daynav">
    <button class="nb">‹</button><span class="dl">Wed · 16 September</span><button class="nb">›</button>
  </div>

  <div class="free">
    <span class="num">4h 20m</span><span class="lab">open today</span>
    <span class="sub">3 free stretches</span>
  </div>

  <div class="tl">
    <div class="trow"><div class="tm">5:30<small>35m</small></div>
      <div class="blk done"><span class="box"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></span><span class="nm">Fajr</span></div></div>

    <div class="trow"><div class="tm">6:05<small>55m</small></div>
      <div class="blk free-blk"><span class="nm">Open</span><span class="plan">+ plan</span></div></div>

    <div class="trow"><div class="tm">7:00<small>45m</small></div>
      <div class="blk task done"><span class="box"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></span><span class="nm">Morning walk</span><span class="dur">45m</span></div></div>

    <div class="trow"><div class="tm">7:45<small>5h</small></div>
      <div class="blk task"><span class="box"></span><span class="nm">Work</span><span class="edit"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span></div></div>

    <div class="nowrow"><span class="lbl">Now 12:48</span><span class="line"></span></div>

    <div class="trow"><div class="tm">1:10<small>35m</small></div>
      <div class="blk"><span class="box"></span><span class="nm">Dhuhr</span></div></div>

    <div class="trow"><div class="tm">1:45<small>2h</small></div>
      <div class="blk free-blk"><span class="nm">Open</span><span class="plan">+ plan</span></div></div>

    <div class="trow"><div class="tm">3:45<small>30m</small></div>
      <div class="blk task"><span class="box"></span><span class="nm">Read 10 pages</span><span class="dur">30m</span></div></div>

    <div class="trow"><div class="tm">5:35<small>35m</small></div>
      <div class="blk"><span class="box"></span><span class="nm">Asr</span></div></div>

    <div class="trow"><div class="tm">6:10<small>45m</small></div>
      <div class="blk task"><span class="box"></span><span class="nm">Gym</span><span class="dur">45m</span></div></div>

    <div class="trow"><div class="tm">7:25<small>35m</small></div>
      <div class="blk"><span class="box"></span><span class="nm">Maghrib</span></div></div>

    <div class="trow"><div class="tm">8:00<small>1h 25m</small></div>
      <div class="blk free-blk"><span class="nm">Open</span><span class="plan">+ plan</span></div></div>

    <div class="trow"><div class="tm">9:25<small>35m</small></div>
      <div class="blk"><span class="box"></span><span class="nm">Isha</span></div></div>
  </div>
</div>

<nav class="tabs">
  <button class="tab"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Today</button>
  <button class="tab on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Pehar</button>
  <button class="tab"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Overview</button>
  <button class="tab"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Template</button>
</nav>

</body>
</html>
